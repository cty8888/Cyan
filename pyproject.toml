[project]
name = "cyan"
version = "0.1.0"
description = "一个不依赖 Agent 框架、从零实现的命令行编程智能体"
readme = "README.md"
authors = [
    { name = "cty", email = "231870165@smail.nju.edu.cn" }
]
requires-python = ">=3.10"
dependencies = [
    "openai>=3.5.0",
    "prompt-toolkit>=3.0.53",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
]

[project.scripts]
cyan = "cyan:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
